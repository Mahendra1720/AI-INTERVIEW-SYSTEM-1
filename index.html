<!DOCTYPE html>
<html>
<head>
  <title>AI Interview System</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
<div class="container">

  <h1>🤖 AI Interview System</h1>

  <input id="project" placeholder="Enter project title">
  <button onclick="startInterview()">Start</button>

  <h2 id="question">Click Start</h2>

  <textarea id="answer" placeholder="Type your answer"></textarea>

  <div>
    <button onclick="startSpeech()">🎤 Speak</button>
    <button onclick="submitAnswer()">Submit Answer</button>
  </div>

  <div class="card">
    <h3>Score & Feedback</h3>
    <p id="score"></p>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
